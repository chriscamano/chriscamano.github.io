name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
      PAGES_REPO_NWO: ${{ github.repository }}
      JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Patch bibtex-ruby for Ruby 3
        run: |
          ruby <<'RUBY'
          root = `bundle show bibtex-ruby`.strip
          abort("Could not resolve bibtex-ruby path") if root.empty?

          patches = {
            "lib/bibtex/bibliography.rb" => [
              [
                /def each\s*\n\s*if block_given\?\s*\n\s*data\.each\(&Proc\.new\)\s*\n\s*self\s*\n\s*else\s*\n\s*to_enum\s*\n\s*end\s*\n\s*end/m,
                <<~'PATCH'
                  def each(&block)
                    if block
                      data.each(&block)
                      self
                    else
                      to_enum(:each)
                    end
                  end
                PATCH
              ],
              [
                /def each_entry\s*\n\s*if block_given\?\s*\n\s*q\('@entry'\)\.each\(&Proc\.new\)\s*\n\s*else\s*\n\s*q\('@entry'\)\.to_enum\s*\n\s*end\s*\n\s*end/m,
                <<~'PATCH'
                  def each_entry(&block)
                    if block
                      q('@entry').each(&block)
                    else
                      q('@entry').to_enum
                    end
                  end
                PATCH
              ]
            ],
            "lib/bibtex/entry.rb" => [
              [
                /def each\s*\n\s*if block_given\?\s*\n\s*fields\.each\(&Proc\.new\)\s*\n\s*self\s*\n\s*else\s*\n\s*to_enum\s*\n\s*end\s*\n\s*end/m,
                <<~'PATCH'
                  def each(&block)
                    if block
                      fields.each(&block)
                      self
                    else
                      to_enum(:each)
                    end
                  end
                PATCH
              ],
              [
                /def convert\(\*filters\)\s*\n\s*block_given\?\s*\?\s*dup\.convert!\(\*filters,\s*&Proc\.new\)\s*:\s*dup\.convert!\(\*filters\)\s*\n\s*end/m,
                <<~'PATCH'
                  def convert(*filters, &block)
                    block ? dup.convert!(*filters, &block) : dup.convert!(*filters)
                  end
                PATCH
              ]
            ]
          }

          changed = []
          patches.each do |relative_path, replacements|
            path = File.join(root, relative_path)
            src = File.read(path)
            before = src.dup
            replacements.each { |regex, replacement| src.gsub!(regex, replacement) }
            next if src == before
            File.write(path, src)
            changed << path
          end

          puts(changed.empty? ? "No bibtex-ruby patch needed" : "Patched:\n- #{changed.join("\n- ")}")

          unsafe = %w[
            data.each(&Proc.new)
            q('@entry').each(&Proc.new)
            fields.each(&Proc.new)
            dup.convert!(*filters, &Proc.new)
          ]

          remaining = []
          %w[lib/bibtex/bibliography.rb lib/bibtex/entry.rb].each do |relative_path|
            path = File.join(root, relative_path)
            body = File.read(path)
            unsafe.each do |signature|
              remaining << "#{relative_path}: #{signature}" if body.include?(signature)
            end
          end

          abort("bibtex-ruby compatibility patch did not apply cleanly:\n#{remaining.join("\n")}") unless remaining.empty?
          RUBY

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
