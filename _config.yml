favicon: ./assets/img/newten.svg
# favicon_dark: ./assets/img/favicon-dark.png

enable_footnote: False

# Auto Dark Mode
# You may use the option to disable the automatic dark theme
auto_dark_mode: true

# Font
# You can use this option to choose between Serif or Sans Serif fonts.
font: "Sans Serif" # or "Sans Serif"

sass:
  style: compressed

# Google Analytics ID
# Please remove this if you don't use Google Analytics
google_analytics: UA-111540567-4
google_analytics_id: G-LESRVNYQED
# Leave empty to use same-origin /api/* on the current deployment.
# Set this only when the site frontend and API are deployed on different domains.
views_api_base:

collections:
  gallery:
    output: true
    permalink: /gallery/:slug/

# Use this project as a remote theme for GitHub Pages
# See the guide here: https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
remote_theme: yaoyao-liu/minimal-light
# _config.yml
banner: /assets/images/banner.png
plugins:
  - jekyll-scholar
scholar:
  source: assets/bib
  bibliography: refs.bib
  style: ieee

# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/
  - node_modules/
  - vendor
